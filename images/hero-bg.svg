<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2B48C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>
  
  <!-- Rolling hills -->
  <path d="M0 600 Q400 500 800 600 T1600 600 L1920 600 L1920 1080 L0 1080 Z" fill="#6B8E23" opacity="0.7"/>
  <path d="M0 700 Q300 600 600 700 T1200 700 T1920 700 L1920 1080 L0 1080 Z" fill="#556B2F" opacity="0.5"/>
  
  <!-- Historic house silhouette -->
  <g transform="translate(1400, 400) scale(0.8)">
    <!-- House body -->
    <rect x="0" y="100" width="200" height="150" fill="url(#houseGradient)"/>
    <!-- Roof -->
    <polygon points="0,100 100,20 200,100" fill="#654321"/>
    <!-- Chimney -->
    <rect x="160" y="40" width="20" height="60" fill="#654321"/>
    <!-- Windows -->
    <rect x="30" y="130" width="30" height="40" fill="#FFE4B5"/>
    <rect x="140" y="130" width="30" height="40" fill="#FFE4B5"/>
    <!-- Door -->
    <rect x="85" y="170" width="30" height="80" fill="#8B4513"/>
    <!-- Porch -->
    <rect x="70" y="240" width="60" height="10" fill="#654321"/>
  </g>
  
  <!-- Garden elements -->
  <g transform="translate(200, 650)">
    <!-- Vegetable rows -->
    <rect x="0" y="0" width="300" height="5" fill="#228B22"/>
    <rect x="0" y="20" width="300" height="5" fill="#228B22"/>
    <rect x="0" y="40" width="300" height="5" fill="#228B22"/>
    <!-- Plants -->
    <circle cx="50" cy="2" r="3" fill="#32CD32"/>
    <circle cx="100" cy="2" r="3" fill="#32CD32"/>
    <circle cx="150" cy="2" r="3" fill="#32CD32"/>
    <circle cx="200" cy="2" r="3" fill="#32CD32"/>
    <circle cx="250" cy="2" r="3" fill="#32CD32"/>
  </g>
  
  <!-- Trees -->
  <g transform="translate(100, 500)">
    <rect x="0" y="40" width="10" height="60" fill="#8B4513"/>
    <circle cx="5" cy="30" r="25" fill="#228B22"/>
  </g>
  
  <g transform="translate(1600, 520)">
    <rect x="0" y="40" width="12" height="80" fill="#8B4513"/>
    <circle cx="6" cy="25" r="30" fill="#228B22"/>
  </g>
  
  <!-- Clouds -->
  <g opacity="0.6">
    <ellipse cx="300" cy="150" rx="40" ry="25" fill="white"/>
    <ellipse cx="320" cy="150" rx="50" ry="30" fill="white"/>
    <ellipse cx="340" cy="150" rx="35" ry="20" fill="white"/>
    
    <ellipse cx="1200" cy="200" rx="60" ry="35" fill="white"/>
    <ellipse cx="1230" cy="200" rx="45" ry="25" fill="white"/>
  </g>
</svg>